# CodeGuardian — Development & Production Docker Compose

version: "3.9"

services:
  # ============================================================
  # Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeguardian
      POSTGRES_USER: cg_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cg_secret_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg_user -d codeguardian"]
      interval: 10s
      retries: 5

  # ============================================================
  # Cache & Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # ============================================================
  # API Server
  # ============================================================
  api:
    build: .
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://cg_user:cg_secret_2024@postgres:5432/codeguardian
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - repos:/app/repos
      - reports:/app/reports

  # ============================================================
  # Celery Worker
  # ============================================================
  worker:
    build: .
    command: celery -A src.queue.tasks worker --concurrency=4 --loglevel=info --queues=codeguardian
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://cg_user:cg_secret_2024@postgres:5432/codeguardian
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - repos:/app/repos
      - reports:/app/reports

  # ============================================================
  # Flower (Celery monitoring)
  # ============================================================
  flower:
    image: mher/flower
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # Monitoring
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  repos:
  reports:
  prometheus-data:
  grafana-data:
